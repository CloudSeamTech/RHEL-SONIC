name: SONIC Academy curriculum checks

on:
  pull_request:
    branches: [main]
  push:
    branches: [curriculum/explain-every-step]

permissions:
  contents: read

jobs:
  curriculum:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install application dependencies
        run: npm ci
      - name: Install local terminal companion dependencies
        run: npm ci --prefix local-companion
      - name: Run curriculum and companion tests
        run: npm test
      - name: TypeScript check
        run: npx tsc --noEmit
      - name: Build production assets
        run: npm run build
