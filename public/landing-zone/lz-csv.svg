<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc"><title id="title">Make a pretend inventory file</title><desc id="desc">Original teaching diagram, not an Azure screenshot.</desc><rect width="1200" height="505" fill="#080808"/><text x="46" y="40" fill="#21c5db" font-family="Arial,sans-serif" font-size="18">SONIC-Academy · ORIGINAL TEACHING DIAGRAM</text><text x="46" y="86" fill="#eaeaea" font-family="Arial,sans-serif" font-size="30">Make a pretend inventory file</text><rect x="45" y="115" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="144" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">File</text><text x="65" y="173" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">cloudseam-inventory.csv · plain text, not .csv.txt</text><rect x="45" y="205" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="234" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Columns</text><text x="65" y="263" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">asset_id, device_name, os, owner_group</text><rect x="45" y="295" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="324" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Three fake rows</text><text x="65" y="353" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">LAB-001 APP01 · LAB-002 ALMA01 · LAB-003 DC01</text><rect x="45" y="385" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="414" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Keep out</text><text x="65" y="443" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Passwords, real people, customer records and production exports</text></svg>