<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 505" role="img" aria-labelledby="title desc"><title id="title">Why tags can help reduce costs</title><desc id="desc">Original teaching diagram, not an Azure screenshot.</desc><rect width="1200" height="505" fill="#080808"/><text x="46" y="40" fill="#21c5db" font-family="Arial,sans-serif" font-size="18">SONIC-Academy · ORIGINAL TEACHING DIAGRAM</text><text x="46" y="86" fill="#eaeaea" font-family="Arial,sans-serif" font-size="30">Why tags can help reduce costs</text><rect x="45" y="115" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="144" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Tag</text><text x="65" y="173" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Find resources for this lab in reports and searches</text><rect x="45" y="205" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="234" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Decision</text><text x="65" y="263" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Spot an expired lab or an unknown owner</text><rect x="45" y="295" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="324" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Action</text><text x="65" y="353" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">Delete or resize what is no longer needed</text><rect x="45" y="385" width="1110" height="76" fill="#101010" stroke="#242424"/><text x="65" y="414" fill="#21c5db" font-family="Arial,sans-serif" font-size="21">Saving</text><text x="65" y="443" fill="#eaeaea" font-family="Arial,sans-serif" font-size="21">The action saves money; the label itself does not</text></svg>