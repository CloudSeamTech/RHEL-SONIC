<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="564" viewBox="0 0 1100 564"><rect width="1100" height="564" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Separate the three products</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">Your lab notes</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Write three lines: Wazuh is free monitoring software; Defender for Endpoint is Microsoft</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">endpoint detection and response; Defender for Cloud includes free posture checks plus</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18">separately priced protection plans. Built-in Defender Antivirus is not the same as the paid</text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">endpoint portal.</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">Our low-cost Microsoft route protects a server through Defender for Servers Plan 1 and Azure</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">Arc. It does not require renting Azure VDI, and the server plan does not license Windows 11</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">client desktops.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Use APP01 as the first server pilot, an AlmaLinux endpoint for Wazuh, and a local Wazuh</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18">manager. Keep DC01/DC02 dedicated to directory services.</text><text x="36" y="468" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="492" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: Your inventory separates local compute, endpoint software and Azure protection.</text><text x="36" y="516" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>