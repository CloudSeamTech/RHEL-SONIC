<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="492" viewBox="0 0 1100 492"><rect width="1100" height="492" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Create only the lab resource group</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">Azure portal → Resource groups → Create</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Choose the recorded lab subscription. Enter rg-cloudseam-security-lab and an appropriate region</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">for metadata, then Review + create → Create. A resource group alone does not rent a VM.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">Open its Overview and confirm the subscription. Avoid creating a VPN Gateway, Bastion, Log</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">Analytics workspace or managed domain just to follow this local-server lab. Those services can</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">add charges.</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">Record the group for inventory and later cleanup. Keep shared production resources out of it.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The lab group exists with no unexpected paid infrastructure.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>