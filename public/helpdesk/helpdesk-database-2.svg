<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="492" viewBox="0 0 1100 492"><rect width="1100" height="492" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Create the application database</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · MariaDB command prompt from Start</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Open the MariaDB command prompt and connect with mariadb -u root -p. Type the password at the</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">prompt.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">Run the SQL below one statement at a time. Replace REPLACE_WITH_UNIQUE_SECRET locally with a</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">new unique password; do not submit that placeholder or upload your real password.</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">Give privileges only on osticket.*, not every database. FLUSH PRIVILEGES is unnecessary after</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">CREATE USER and GRANT.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: Database osticket and its dedicated localhost account exist.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>