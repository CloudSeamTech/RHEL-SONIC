<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660"><rect width="1100" height="660" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Unpack and configure PHP</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · File Explorer and Notepad as administrator</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Install the Microsoft Visual C++ x64 Redistributable. Extract PHP to C:\PHP so php-cgi.exe is</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">directly inside that folder.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">Copy php.ini-production to php.ini. Open php.ini and set extension_dir=&quot;C:\PHP\ext&quot;. Enable the</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">supplied mysqli, mbstring, intl, gd and fileinfo extensions by removing their leading</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">semicolons. Enable openssl if supplied and needed for TLS mail. Do not download random</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">extension DLLs.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Set date.timezone=&quot;UTC&quot;, log_errors=On, display_errors=Off and cgi.fix_pathinfo=1. Keep PHP</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">files outside the website root. Save and run the checks.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="468" fill="#eaeaea" font-family="sans-serif" font-size="18">Also set session.save_path=&quot;C:\Sites\HelpdeskRuntime\sessions&quot;,</text><text x="36" y="492" fill="#eaeaea" font-family="sans-serif" font-size="18">upload_tmp_dir=&quot;C:\Sites\HelpdeskRuntime\uploads&quot; and error_log=&quot;C:\Sites\HelpdeskRuntime\php-</text><text x="36" y="516" fill="#eaeaea" font-family="sans-serif" font-size="18">errors.log&quot;. We will create and permission those private runtime folders when we create the</text><text x="36" y="540" fill="#eaeaea" font-family="sans-serif" font-size="18">pool.</text><text x="36" y="564" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="588" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: PHP reports 8.4 and the required extensions load without startup warnings.</text><text x="36" y="612" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>