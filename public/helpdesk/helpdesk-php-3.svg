<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="564" viewBox="0 0 1100 564"><rect width="1100" height="564" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Prove PHP runs and remove the test</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · elevated PowerShell and browser</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Write the temporary page below into the existing IIS root. It prints the PHP version and server</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">interface actually serving the browser request; it does not publish a phpinfo dump.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">Open http://localhost/php-check.php on APP01. Check that the browser shows PHP 8.4.27 or a</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">newer patched 8.4 release, followed by cgi-fcgi. If it shows an older version, a different</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18">runtime is still mapped in IIS. If PHP downloads or appears as source text, stop and fix the</text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">handler.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Remove the test file after checking. A successful command-line PHP test alone does not prove</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">IIS can execute PHP.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="468" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The IIS-served page reports the required patched runtime and cgi-fcgi, and the temporary</text><text x="36" y="492" fill="#eaeaea" font-family="sans-serif" font-size="18">page is removed.</text><text x="36" y="516" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>