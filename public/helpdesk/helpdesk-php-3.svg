<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="492" viewBox="0 0 1100 492"><rect width="1100" height="492" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Prove PHP runs and remove the test</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · elevated PowerShell and browser</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Write a temporary PHP page into the existing IIS root using the command below. It prints a</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">short message, not a phpinfo dump.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">Open http://localhost/php-check.php on APP01. You should see PHP is working. If code downloads</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">or displays as text, stop and fix the handler.</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">Remove the test file after checking. A successful command-line PHP test alone does not prove</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18">IIS can execute PHP.</text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The browser executes PHP, and the test page is removed.</text><text x="36" y="444" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>