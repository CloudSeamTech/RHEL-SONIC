<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468"><rect width="1100" height="468" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Test the name from a client</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">Private Windows lab client · PowerShell</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Confirm this client uses your AD DNS servers. Run Resolve-DnsName below and compare the</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">returned IP to APP01.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">A wrong answer usually means a stale record, wrong client DNS server or mismatched subnet.</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">Correct that before opening the app.</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">Use the exact hostname in IIS bindings. Browsing by IP can select a different IIS site.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: The private client resolves the intended APP01 address.</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>