<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="468" viewBox="0 0 1100 468"><rect width="1100" height="468" fill="#080808"/><text x="36" y="45" fill="#21c5db" font-family="sans-serif" font-size="20">SONIC-Academy · illustrated action guide</text><text x="36" y="82" fill="#eaeaea" font-family="sans-serif" font-size="25">Check the basic website</text><text x="36" y="115" fill="#dfb656" font-family="sans-serif" font-size="16">Teaching diagram · not a screenshot or actual terminal result</text><text x="36" y="156" fill="#eaeaea" font-family="sans-serif" font-size="18">APP01 · browser</text><text x="36" y="180" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="204" fill="#eaeaea" font-family="sans-serif" font-size="18">Open http://localhost/index.html if you created the earlier APP01 test page, or</text><text x="36" y="228" fill="#eaeaea" font-family="sans-serif" font-size="18">http://localhost for the default IIS page.</text><text x="36" y="252" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="276" fill="#eaeaea" font-family="sans-serif" font-size="18">If the browser cannot connect, check W3SVC using the command below. Fix the role/service before</text><text x="36" y="300" fill="#eaeaea" font-family="sans-serif" font-size="18">adding osTicket.</text><text x="36" y="324" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="348" fill="#eaeaea" font-family="sans-serif" font-size="18">Keep the existing test page: it remains useful when you migrate APP01 to Azure.</text><text x="36" y="372" fill="#eaeaea" font-family="sans-serif" font-size="18"></text><text x="36" y="396" fill="#eaeaea" font-family="sans-serif" font-size="18">Check: IIS serves a basic page on APP01.</text><text x="36" y="420" fill="#eaeaea" font-family="sans-serif" font-size="18"></text></svg>