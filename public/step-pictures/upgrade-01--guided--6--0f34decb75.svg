<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1258" viewBox="0 0 1200 1258" role="img" aria-labelledby="title desc"><title id="title">Create the Server 2022 upgrade media disk — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1258" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Create the Server 2022 upgrade media disk</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="382" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">$rg = Read-Host &apos;APP02 resource group&apos;</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">$vmName = &apos;APP02&apos;</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">$vm = Get-AzVM -ResourceGroupName $rg -Name $vmName -ErrorAction Stop</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">$location = $vm.Location</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">$zone = if ($vm.Zones) { $vm.Zones[0] } else { &apos;&apos; }</text><text x="54" y="492" font-family="monospace" font-size="18" fill="#eaeaea">$images = @(Get-AzVMImage -Location $location -PublisherName MicrosoftWindowsServer</text><text x="54" y="520" font-family="monospace" font-size="18" fill="#eaeaea">-Offer WindowsServerUpgrade -Skus server2022Upgrade | Sort-Object { [version]$_.Version</text><text x="54" y="548" font-family="monospace" font-size="18" fill="#eaeaea">} -Descending)</text><text x="54" y="576" font-family="monospace" font-size="18" fill="#eaeaea">if ($images.Count -eq 0) { throw &apos;No Server 2022 upgrade image available here.&apos; }</text><text x="54" y="604" font-family="monospace" font-size="18" fill="#eaeaea">$image = Get-AzVMImage -Location $location -PublisherName MicrosoftWindowsServer -Offer</text><text x="54" y="632" font-family="monospace" font-size="18" fill="#eaeaea">WindowsServerUpgrade -Skus server2022Upgrade -Version $images[0].Version</text><text x="44" y="683" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="715" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="745" r="18" fill="#21c5db"/><text x="54" y="752" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="749" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">In the same Az PowerShell session, use the command below.</text><path d="M60 788v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="804" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="834" r="18" fill="#21c5db"/><text x="54" y="841" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="838" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Enter the ACTUAL existing VM resource group, region and matching zone; leave zone empty for</text><text x="96" y="868" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">a regional VM.</text><path d="M60 906v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="922" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="952" r="18" fill="#21c5db"/><text x="54" y="959" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="956" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">The script creates a billable managed disk from Microsoft’s hidden upgrade-media image and</text><text x="96" y="986" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">stops if APP02 or its placement does not match.</text><text x="44" y="1040" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="1078" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="1108" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1140" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">A managed disk named SONIC-Server2022-Upgrade is returned in APP02’s region and zone.</text><text x="30" y="1235" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>