<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="918" viewBox="0 0 1200 918" role="img" aria-labelledby="title desc"><title id="title">Record current endpoint evidence — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="918" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Record current endpoint evidence</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">date -Is</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">rpm -q wazuh-agent</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">sudo systemctl is-active wazuh-agent</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">sudo tail -n 50 /var/ossec/logs/ossec.log</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="502" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="532" r="18" fill="#21c5db"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">date -Is records a timezone-bearing timestamp. rpm -q records the installed version;</text><text x="96" y="566" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">is-active reports the service state. tail shows recent application messages, which must be</text><text x="96" y="596" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">correlated with that time.</text><path d="M60 633v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="649" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="679" r="18" fill="#21c5db"/><text x="54" y="686" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="683" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Write down the actual hostname and timestamp before switching tabs.</text><rect x="28" y="738" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="768" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="800" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">You have current endpoint identity and connection evidence.</text><text x="30" y="895" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>