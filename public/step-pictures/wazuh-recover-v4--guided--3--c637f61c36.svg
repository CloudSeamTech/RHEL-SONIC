<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1043" viewBox="0 0 1200 1043" role="img" aria-labelledby="title desc"><title id="title">Branch A only: remove the reviewed agent package — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1043" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Branch A only: remove the reviewed agent package</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo systemctl stop wazuh-agent</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">sudo dnf remove wazuh-agent</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">rpm -q wazuh-agent</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">systemctl list-unit-files --type=service --no-pager</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#eaeaea">sudo ls -ld /var/ossec /var/ossec/etc</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="529" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="559" r="18" fill="#21c5db"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Skip this card for disk restore.</text><path d="M60 602v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="618" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="648" r="18" fill="#21c5db"/><text x="54" y="655" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="652" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Stop the agent, then inspect DNF’s removal list.</text><path d="M60 691v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="707" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="737" r="18" fill="#21c5db"/><text x="54" y="744" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="741" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Enter y only if the proposed removal matches the approved endpoint-agent scope; otherwise</text><text x="96" y="771" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">enter n.</text><text x="44" y="825" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="863" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="893" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="925" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The package is absent; residual files and units are recorded rather than silently discarded.</text><text x="30" y="1020" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>