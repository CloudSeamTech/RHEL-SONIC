<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="980" viewBox="0 0 1200 980" role="img" aria-labelledby="title desc"><title id="title">Return to local Windows PowerShell — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="980" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Return to local Windows PowerShell</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Your Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">$TestFile</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">$KeyPath</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">$EndpointPublicIp</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="475" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="505" r="18" fill="#21c5db"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use your local PowerShell tab, not the connected Linux tab. $TestFile must be the text file</text><text x="96" y="539" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">created earlier, $KeyPath must be your local key, and $EndpointPublicIp must be the</text><text x="96" y="569" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">endpoint address.</text><path d="M60 606v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="622" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="652" r="18" fill="#21c5db"/><text x="54" y="659" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="656" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Display these three values.</text><path d="M60 695v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="711" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="741" r="18" fill="#21c5db"/><text x="54" y="748" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="745" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Make sure the source is the harmless text file, not the private key.</text><rect x="28" y="800" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="830" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="862" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The file, key path and endpoint address match your notes.</text><text x="30" y="957" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>