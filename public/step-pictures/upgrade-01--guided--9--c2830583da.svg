<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="832" viewBox="0 0 1200 832" role="img" aria-labelledby="title desc"><title id="title">Start the in-place upgrade — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="832" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 9 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Start the in-place upgrade</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="112" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">.\setup.exe /auto upgrade /dynamicupdate disable</text><text x="44" y="413" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="445" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="475" r="18" fill="#21c5db"/><text x="54" y="482" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="479" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">From the media folder in elevated Windows PowerShell INSIDE APP02 run the command below.</text><path d="M60 518v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="534" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="564" r="18" fill="#21c5db"/><text x="54" y="571" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="568" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Review and accept licensing only if authorized; select the supported Server 2022 edition</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">matching the installed Desktop Experience configuration when asked.</text><rect x="28" y="652" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="682" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="714" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Windows Setup starts an upgrade that preserves applications/settings and targets Server 2022.</text><text x="30" y="809" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>