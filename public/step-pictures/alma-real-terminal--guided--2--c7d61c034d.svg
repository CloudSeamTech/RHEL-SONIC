<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1067" viewBox="0 0 1200 1067" role="img" aria-labelledby="title desc"><title id="title">Install Node.js and Git, then start the local app — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1067" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Install Node.js and Git, then start the local app</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AlmaLinux 9 GNOME desktop → Activities → Terminal, unless the step names Windows or</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">VMware Workstation Pro.</text><rect x="28" y="277" width="1144" height="220" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Set-Location $env:USERPROFILE</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">git clone --branch main https://github.com/CloudSeamTech/SONIC-Academy.git</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">Set-Location .\SONIC-Academy</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">npm.cmd ci</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">npm.cmd run dev</text><text x="44" y="521" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="553" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="583" r="18" fill="#21c5db"/><text x="54" y="590" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="587" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">On your Windows host, first follow the linked terminal setup guide above this lesson.</text><path d="M60 626v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="642" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="672" r="18" fill="#21c5db"/><text x="54" y="679" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="676" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Download Node.js 24 LTS using its official Windows .msi installer; keep npm package manager</text><text x="96" y="706" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">and Add to PATH selected.</text><path d="M60 744v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="760" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="790" r="18" fill="#21c5db"/><text x="54" y="797" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="794" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Install Git for Windows from its official site, keeping command-line PATH access enabled.</text><text x="44" y="849" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="887" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="917" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="949" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">SONIC opens on localhost, normally port 3000.</text><text x="30" y="1044" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>