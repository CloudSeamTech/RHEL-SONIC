<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="632" viewBox="0 0 1200 632" role="img" aria-labelledby="title desc"><title id="title">Open Server Manager / Manage — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="632" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Open Server Manager / Manage</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">MECM01 Server 2019 guest / Server Manager and elevated Windows PowerShell /</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">authorized administrator.</text><rect x="28" y="277" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Open Server Manager &gt; Manage &gt; Add Roles and Features; review current Configuration Manager</text><text x="96" y="341" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">site prerequisites for IIS, BITS, .NET, RDC and other required components for your selected</text><text x="96" y="371" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">version.</text><rect x="28" y="424" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="454" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="486" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="515" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="609" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>