<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="860" viewBox="0 0 1200 860" role="img" aria-labelledby="title desc"><title id="title">Run the reference check 1 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="860" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 10 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Run the reference check 1</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AG-DC01 and DEST-DC01 / Group Policy Management / authorized administrator in each</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">forest.</text><rect x="28" y="277" width="1144" height="112" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Get-GPO -Name &quot;LAB-Operations-Banner-Dest&quot; -Domain destination.test</text><text x="44" y="413" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="445" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="475" r="18" fill="#21c5db"/><text x="54" y="482" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="479" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use the named shell and machine above.</text><path d="M60 518v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="534" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="564" r="18" fill="#21c5db"/><text x="54" y="571" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="568" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Read each command against the full lesson reference; run these lines only after completing</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the preceding actions.</text><rect x="28" y="652" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="682" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="714" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The destination GPO exists, contains the test banner, and is linked to the destination</text><text x="52" y="743" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Operations OU.</text><text x="30" y="837" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>