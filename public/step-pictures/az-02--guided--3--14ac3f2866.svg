<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="750" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc"><title id="title">Document full-VM prerequisites separately — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="750" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Document full-VM prerequisites separately</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Physical host / Workstation Pro inventory and official Azure migration support matrix</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">/ planning only.</text><rect x="28" y="277" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">For a true rehost, record supported source OS/license, disk conversion/boot generation,</text><text x="96" y="341" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">guest drivers/agent readiness, replication or VHD import method, private connectivity,</text><text x="96" y="371" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">testing, and rollback.</text><path d="M60 408v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="424" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="454" r="18" fill="#21c5db"/><text x="54" y="461" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="458" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use the official Azure Migrate physical/agent-based and VMware support references; exact</text><text x="96" y="488" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">support must be checked for your configuration.</text><rect x="28" y="542" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="572" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="604" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Any full-VM move has an approved, documented method before resources or replication are</text><text x="52" y="633" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">created.</text><text x="30" y="727" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>