<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="782" viewBox="0 0 1200 782" role="img" aria-labelledby="title desc"><title id="title">Use it for games or disconnect it safely — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="782" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 8 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Use it for games or disconnect it safely</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AlmaLinux 9 GNOME desktop → Activities → Terminal, unless the step names Windows or</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">VMware Workstation Pro.</text><rect x="28" y="277" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">For Steam use a Linux-native dedicated library folder on this mounted drive.</text><path d="M60 350v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="366" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="396" r="18" fill="#21c5db"/><text x="54" y="403" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="400" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Grant only that ACTUAL folder to the user Steam Flatpak (via a permissions manager or</text><text x="96" y="430" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">reviewed flatpak override --user --filesystem=EXACT_PATH com.valvesoftware.Steam), then add</text><text x="96" y="460" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the library in Steam Settings → Storage.</text><path d="M60 497v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="513" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="543" r="18" fill="#21c5db"/><text x="54" y="550" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="547" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">When done close apps and unmount/eject before unplugging.</text><rect x="28" y="602" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="632" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="664" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The correct library path is visible, or the data volume ejects cleanly.</text><text x="30" y="759" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>