<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1022" viewBox="0 0 1200 1022" role="img" aria-labelledby="title desc"><title id="title">Record the guest baseline and eligibility — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1022" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Record the guest baseline and eligibility</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="274" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">DISM /online /Get-CurrentEdition</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">DISM /online /Get-Intl</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">Get-Volume -DriveLetter C</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">Get-Service W3SVC</text><text x="54" y="492" font-family="monospace" font-size="18" fill="#eaeaea">Invoke-WebRequest http://localhost/index.html -UseBasicParsing | Select-Object</text><text x="54" y="520" font-family="monospace" font-size="18" fill="#eaeaea">StatusCode</text><text x="44" y="575" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="607" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="637" r="18" fill="#21c5db"/><text x="54" y="644" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="641" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Inside APP02 open Windows PowerShell as administrator and run the read-only checks.</text><path d="M60 680v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="696" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="726" r="18" fill="#21c5db"/><text x="54" y="733" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="730" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Confirm Server 2019, the installed edition, English (United States) for the documented</text><text x="96" y="760" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Azure media route, and sufficient OS disk free space.</text><rect x="28" y="814" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="844" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="876" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The baseline records actual OS/build, edition, language, free space, IIS service, and site</text><text x="52" y="905" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">response.</text><text x="30" y="999" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>