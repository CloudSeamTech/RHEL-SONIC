<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="895" viewBox="0 0 1200 895" role="img" aria-labelledby="title desc"><title id="title">Command 1: read, type, then check — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="895" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Command 1: read, type, then check</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Windows · PowerShell · public key only</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">$VmUser = &quot;rexuser&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">Get-Content -LiteralPath $PublicKeyPath</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="448" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="478" r="18" fill="#21c5db"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">This saves a value in the current PowerShell tab.</text><path d="M60 521v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="537" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="567" r="18" fill="#21c5db"/><text x="54" y="574" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="571" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">It does not create an Azure resource.</text><path d="M60 610v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="626" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="656" r="18" fill="#21c5db"/><text x="54" y="663" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="660" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Replace any REPLACE_WITH text with the real value from your notes before running it.</text><rect x="28" y="715" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="745" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="777" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Usually no output appears. The value is now available in this tab.</text><text x="30" y="872" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>