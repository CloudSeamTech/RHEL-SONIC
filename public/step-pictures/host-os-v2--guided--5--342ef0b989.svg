<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="728" viewBox="0 0 1200 728" role="img" aria-labelledby="title desc"><title id="title">Check the result and save your notes — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="728" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Check the result and save your notes</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL 9 · Bash · rexuser</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Compare the outputs with the VM image and name recorded in Azure.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="342" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#21c5db"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Record both the RHEL release and running kernel.</text><path d="M60 415v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect 