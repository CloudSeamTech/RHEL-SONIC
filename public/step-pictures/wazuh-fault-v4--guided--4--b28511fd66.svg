<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1044" viewBox="0 0 1200 1044" role="img" aria-labelledby="title desc"><title id="title">Observe failure before trying to fix it — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1044" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Observe failure before trying to fix it</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo systemctl restart wazuh-agent</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">sudo systemctl status wazuh-agent --no-pager</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">sudo tail -n 80 /var/ossec/logs/ossec.log</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">sudo journalctl -u wazuh-agent --since &quot;5 minutes ago&quot; --no-pager</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="502" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="532" r="18" fill="#21c5db"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Restart to apply the intentional fault. status may still show active while the application</text><text x="96" y="566" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">cannot connect.</text><path d="M60 604v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="620" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="650" r="18" fill="#21c5db"/><text x="54" y="657" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="654" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Read the recent log and record the failed destination and timestamp.</text><path d="M60 693v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="709" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="739" r="18" fill="#21c5db"/><text x="54" y="746" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="743" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">journalctl -u selects the unit; --since narrows the observation window.</text><text x="44" y="798" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="836" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="866" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="898" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Logs demonstrate failed communication to the wrong destination; do not wait for a dashboard</text><text x="52" y="927" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">badge to catch up.</text><text x="30" y="1021" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>