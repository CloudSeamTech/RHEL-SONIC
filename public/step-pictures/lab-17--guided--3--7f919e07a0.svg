<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="753" viewBox="0 0 1200 753" role="img" aria-labelledby="title desc"><title id="title">Create the Azure member-server target — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="753" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Create the Azure member-server target</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">APP01 Server 2019 Workstation guest, Azure portal, then APP02 Server 2019 Azure</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">member VM / authorized source, transfer, and destination administrators.</text><rect x="28" y="277" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">In Azure portal search Virtual machines &gt; Create &gt; Azure virtual machine.</text><path d="M60 350v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="366" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="396" r="18" fill="#21c5db"/><text x="54" y="403" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="400" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Choose the approved lab resource group/region, name APP02, and explicitly select a Windows</text><text x="96" y="430" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Server 2019 Datacenter Marketplace image.</text><path d="M60 468v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="484" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="514" r="18" fill="#21c5db"/><text x="54" y="521" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="518" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Do not choose Server 2022 yet.</text><rect x="28" y="573" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="603" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="635" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The review page identifies APP02 and a 2019 image.</text><text x="30" y="730" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>