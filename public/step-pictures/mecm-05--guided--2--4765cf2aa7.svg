<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="613" viewBox="0 0 1200 613" role="img" aria-labelledby="title desc"><title id="title">On WSUS01 open IIS Manager and check whether WSUS Administration is listenin — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="613" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">On WSUS01 open IIS Manager and check whether WSUS Administration is</text><text x="30" y="122" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">listenin</text><rect x="28" y="163" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 187h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="193" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="223" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">MECM01 and WSUS01 / Configuration Manager console / authorized site administrator.</text><rect x="28" y="287" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="317" r="18" fill="#21c5db"/><text x="54" y="324" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="321" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">On WSUS01 open IIS Manager and check whether WSUS Administration is listening on HTTP 8530</text><text x="96" y="351" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">or HTTPS 8531; record actual configured ports.</text><rect x="28" y="405" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="435" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="467" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="496" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="590" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>