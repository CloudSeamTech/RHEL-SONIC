<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1049" viewBox="0 0 1200 1049" role="img" aria-labelledby="title desc"><title id="title">Run the reference check 1 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1049" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Run the reference check 1</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">SQL01 / SQL Server Management Studio / authorized Windows-authenticated SQL setup</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">account.</text><rect x="28" y="277" width="1144" height="301" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">CREATE DATABASE AgencyHelpdesk;</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">GO</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">USE AgencyHelpdesk;</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">GO</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">CREATE TABLE dbo.Tickets (</text><text x="54" y="492" font-family="monospace" font-size="18" fill="#eaeaea">TicketID INT PRIMARY KEY,</text><text x="54" y="520" font-family="monospace" font-size="18" fill="#eaeaea">Summary NVARCHAR(100) NOT NULL,</text><text x="54" y="548" font-family="monospace" font-size="18" fill="#eaeaea">Status NVARCHAR(20) NOT NULL</text><text x="44" y="602" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="634" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="664" r="18" fill="#21c5db"/><text x="54" y="671" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="668" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use the named shell and machine above.</text><path d="M60 707v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="723" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="753" r="18" fill="#21c5db"/><text x="54" y="760" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="757" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Read each command against the full lesson reference; run these lines only after completing</text><text x="96" y="787" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the preceding actions.</text><rect x="28" y="841" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="871" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="903" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Two fake rows visible. You can explain DB = the binder, table = one sheet, rows = entries, SSMS</text><text x="52" y="932" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">= management tool.</text><text x="30" y="1026" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>