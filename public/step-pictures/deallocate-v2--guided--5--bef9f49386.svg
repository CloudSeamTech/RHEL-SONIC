<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="697" viewBox="0 0 1200 697" role="img" aria-labelledby="title desc"><title id="title">Website step 4 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="697" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Website step 4</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Your Windows computer · browser → https://portal.azure.com</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">To resume later: open the same VM → Start; wait for Running, recheck public/private IPs and</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">your current source /32, then repeat the TCP and verified SSH checks using the retained</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">private key.</text><path d="M60 384v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="400" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="430" r="18" fill="#21c5db"/><text x="54" y="437" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="434" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Do not generate a new pair just because the VM was stopped.</text><rect x="28" y="489" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="519" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="551" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Check the named resource and settings before the next step. If the page shows an error, stop</text><text x="52" y="580" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">and read it before continuing.</text><text x="30" y="674" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>