<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="575" viewBox="0 0 1200 575" role="img" aria-labelledby="title desc"><title id="title">Set a non-overlapping subnet — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="575" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Set a non-overlapping subnet</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Physical Windows host / Workstation Pro Virtual Network Editor; authorized host</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">administrator.</text><rect x="28" y="277" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">For the example plan set Subnet IP to 192.168.77.0 and Subnet mask to 255.255.255.0 only</text><text x="96" y="341" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">after checking it does not overlap your host, home router, VPN, or Azure address range.</text><rect x="28" y="395" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="425" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="457" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Your chosen lab subnet is private and does not overlap another route you use.</text><text x="30" y="552" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>