<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="580" viewBox="0 0 1200 580" role="img" aria-labelledby="title desc"><title id="title">Record the version journey — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="580" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Record the version journey</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Physical Windows host / File Explorer / lab notes; no Azure deployment.</text><rect x="28" y="253" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Create a lab note: VMware Workstation Pro on the host; Windows Server 2019 Desktop</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Experience on premises; Server 2019 Azure destination; migrate test workload/data; then</text><text x="96" y="347" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">upgrade that Azure member server to Server 2022.</text><rect x="28" y="400" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="430" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="462" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Your note distinguishes moving an application from moving a whole VM.</text><text x="30" y="557" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>