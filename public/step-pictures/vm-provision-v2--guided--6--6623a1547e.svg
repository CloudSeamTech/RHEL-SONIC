<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="786" viewBox="0 0 1200 786" role="img" aria-labelledby="title desc"><title id="title">Website step 4 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="786" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Website step 4</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Your Windows computer · browser → https://portal.azure.com</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Disks: one Standard SSD managed OS disk at the image-supported default/minimum size</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">(commonly 64 GiB; verify your image); no data disks.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="371" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#21c5db"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Networking: existing vnet-rhel9-lab and snet-rhel9-lab; one new Standard static public</text><text x="96" y="435" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">IPv4; Advanced NIC network security group → existing nsg-rhel9-lab.</text><path d="M60 473v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="489" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="519" r="18" fill="#21c5db"/><text x="54" y="526" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="523" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">No additional broad SSH rule, load balancer, Bastion, or NAT Gateway.</text><rect x="28" y="578" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="608" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Check the named resource and settings before the next step. If the page shows an error, stop</text><text x="52" y="669" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">and read it before continuing.</text><text x="30" y="763" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>