<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="795" viewBox="0 0 1200 795" role="img" aria-labelledby="title desc"><title id="title">Match the network rule and test from real clients — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="795" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Match the network rule and test from real clients</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Work Windows computer · browser and approved network console</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">For an Azure manager: open Azure → the manager VM → Networking → its actual network</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">security group → Inbound security rules.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="371" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#21c5db"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Open the existing dashboard TCP 443 rule.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="460" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="490" r="18" fill="#21c5db"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Save its old source in your notes.</text><text x="44" y="549" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="587" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="617" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="649" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Allowed clients can reach HTTPS. An approved outside-range test confirms the intended</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">restriction. SSH remains available.</text><text x="30" y="772" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>