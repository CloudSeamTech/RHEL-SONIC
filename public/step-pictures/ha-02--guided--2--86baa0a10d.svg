<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="title desc"><title id="title">If deploying in Azure, plan two private SQL VMs. Use separate availability z — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="726" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">If deploying in Azure, plan two private SQL VMs. Use separate</text><text x="30" y="122" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">availability z</text><rect x="28" y="163" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 187h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="193" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="223" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">SQL01 and SQL02 / Windows Failover Clustering preparation / authorized cluster</text><text x="114" y="251" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">administrator; optional extension.</text><rect x="28" y="311" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="341" r="18" fill="#21c5db"/><text x="54" y="348" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="345" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">If deploying in Azure, plan two private SQL VMs.</text><path d="M60 384v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="400" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="430" r="18" fill="#21c5db"/><text x="54" y="437" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="434" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use separate availability zones where supported; Microsoft recommends separate subnets for</text><text x="96" y="464" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">a multi-subnet SQL AG to avoid a load balancer for the listener.</text><rect x="28" y="518" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="548" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="580" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="609" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="703" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>