<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1000" viewBox="0 0 1200 1000" role="img" aria-labelledby="title desc"><title id="title">Search and inspect — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1000" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Search and inspect</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AlmaLinux 9 GNOME desktop → Activities → Terminal, unless the step names Windows or</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">VMware Workstation Pro.</text><rect x="28" y="277" width="1144" height="220" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">cd ~/DesktopPractice</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">grep -n &quot;second&quot; notes.txt</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">wc -l notes.txt</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">find . -maxdepth 1 -type f</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">ls -lah | less</text><text x="44" y="521" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="553" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="583" r="18" fill="#21c5db"/><text x="54" y="590" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="587" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Find files and filter text.</text><path d="M60 626v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="642" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="672" r="18" fill="#21c5db"/><text x="54" y="679" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="676" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">A pipe sends one command’s output into the next.</text><path d="M60 715v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="731" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="761" r="18" fill="#21c5db"/><text x="54" y="768" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="765" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use less to page through longer output and press q to leave.</text><rect x="28" y="820" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="850" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="882" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">grep returns the matching line and wc counts two lines.</text><text x="30" y="977" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>