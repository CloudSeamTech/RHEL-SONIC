<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="702" viewBox="0 0 1200 702" role="img" aria-labelledby="title desc"><title id="title">Say aloud: SQL01 + SQL02 + Cloud Witness = three possible quorum votes; majo — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="702" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Say aloud: SQL01 + SQL02 + Cloud Witness = three possible quorum</text><text x="30" y="122" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">votes; majo</text><rect x="28" y="163" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 187h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="193" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="223" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Lab worksheet / optional SQL high availability design.</text><rect x="28" y="287" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="317" r="18" fill="#21c5db"/><text x="54" y="324" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="321" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Say aloud: SQL01 + SQL02 + Cloud Witness = three possible quorum votes; majority generally</text><text x="96" y="351" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">allows the cluster to remain online.</text><path d="M60 389v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="405" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="435" r="18" fill="#21c5db"/><text x="54" y="442" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="439" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Dynamic quorum/witness can adjust votes.</text><rect x="28" y="494" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="524" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="556" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="585" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="679" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>