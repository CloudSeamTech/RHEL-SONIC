<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1002" viewBox="0 0 1200 1002" role="img" aria-labelledby="title desc"><title id="title">Prepare the Azure PowerShell tool — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1002" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Prepare the Azure PowerShell tool</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="193" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Connect-AzAccount</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">$subscriptionId = Read-Host &apos;Approved subscription ID&apos;</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">Set-AzContext -Subscription $subscriptionId</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">Get-AzContext</text><text x="44" y="494" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="526" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="556" r="18" fill="#21c5db"/><text x="54" y="563" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="560" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">On your authorized administration workstation open Windows PowerShell with the Az</text><text x="96" y="590" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">PowerShell module installed.</text><path d="M60 628v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="644" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="674" r="18" fill="#21c5db"/><text x="54" y="681" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="678" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Run Connect-AzAccount and explicitly set the correct subscription.</text><path d="M60 717v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="733" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="763" r="18" fill="#21c5db"/><text x="54" y="770" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="767" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">This is Az PowerShell, not the az CLI and not a command to run on a domain controller.</text><rect x="28" y="822" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="852" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="884" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Get-AzContext identifies the intended subscription and account.</text><text x="30" y="979" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>