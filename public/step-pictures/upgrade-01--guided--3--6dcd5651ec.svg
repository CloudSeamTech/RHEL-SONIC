<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="title desc"><title id="title">Read the Azure-specific upgrade constraints — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="810" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Read the Azure-specific upgrade constraints</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Open the Microsoft Azure in-place-upgrade reference linked in this lesson.</text><path d="M60 350v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="366" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="396" r="18" fill="#21c5db"/><text x="54" y="403" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="400" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use its Azure VM OS Upgrade Assessment Tool and resolve any reported incompatibilities for</text><text x="96" y="430" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">APP02 before continuing.</text><path d="M60 468v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="484" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="514" r="18" fill="#21c5db"/><text x="54" y="521" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="518" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">The route is 2019 to 2022 using server2022Upgrade media, not the newer 2025 example</text><text x="96" y="548" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">default.</text><rect x="28" y="602" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="632" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="664" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The supported source/target, licensing, language, application compatibility, and disk</text><text x="52" y="693" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">requirements are recorded.</text><text x="30" y="787" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>