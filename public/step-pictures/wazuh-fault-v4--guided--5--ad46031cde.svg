<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="906" viewBox="0 0 1200 906" role="img" aria-labelledby="title desc"><title id="title">Prove the cause with a focused comparison — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="906" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Prove the cause with a focused comparison</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="112" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo diff -u /var/ossec/etc/ossec.conf.sonic-working /var/ossec/etc/ossec.conf</text><text x="44" y="389" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="421" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="451" r="18" fill="#21c5db"/><text x="54" y="458" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="455" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">diff -u compares the saved and current files with context.</text><path d="M60 494v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="510" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="540" r="18" fill="#21c5db"/><text x="54" y="547" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="544" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Its exit status 1 means differences were found, not that comparison failed.</text><path d="M60 583v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="599" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="629" r="18" fill="#21c5db"/><text x="54" y="636" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="633" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Inspect locally; do not publish unrelated secret-bearing configuration.</text><text x="44" y="688" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="726" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="756" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="788" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The one changed manager address explains the connection failure.</text><text x="30" y="883" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>