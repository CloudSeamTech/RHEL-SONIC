<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1070" viewBox="0 0 1200 1070" role="img" aria-labelledby="title desc"><title id="title">Add one temporary HTTPS rule — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1070" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Add one temporary HTTPS rule</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Wazuh manager · connected RHEL Bash session · rexuser</text><rect x="28" y="253" width="1144" height="247" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">read -r -p &quot;Verified firewalld zone: &quot; SONIC_ZONE</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">read -r -p &quot;Approved source IPv4/32 OR subnet/CIDR: &quot; SONIC_SOURCE</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">printf -v SONIC_HTTPS_RULE &apos;rule family=&quot;ipv4&quot; source address=&quot;%s&quot; port port=&quot;443&quot;</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">protocol=&quot;tcp&quot; accept&apos; &quot;$SONIC_SOURCE&quot;</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --zone=&quot;$SONIC_ZONE&quot; --add-rich-rule=&quot;$SONIC_HTTPS_RULE&quot; --timeout=10m</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --zone=&quot;$SONIC_ZONE&quot; --query-rich-rule=&quot;$SONIC_HTTPS_RULE&quot;</text><text x="44" y="524" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="556" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="586" r="18" fill="#21c5db"/><text x="54" y="593" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="590" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">At the first prompt, enter the verified zone name.</text><path d="M60 629v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="645" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="675" r="18" fill="#21c5db"/><text x="54" y="682" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="679" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">At the second, choose either one actual address ending in /32 or the approved actual subnet</text><text x="96" y="709" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">range.</text><path d="M60 747v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="763" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="793" r="18" fill="#21c5db"/><text x="54" y="800" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="797" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use only one choice for this change.</text><text x="44" y="852" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="890" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="920" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="952" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The rule is accepted and query returns yes. Do not continue if a command reports an error.</text><text x="30" y="1047" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>