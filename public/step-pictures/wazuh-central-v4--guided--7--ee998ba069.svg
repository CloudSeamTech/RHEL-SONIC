<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1073" viewBox="0 0 1200 1073" role="img" aria-labelledby="title desc"><title id="title">Prevent an accidental Wazuh upgrade — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1073" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Prevent an accidental Wazuh upgrade</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo cat /etc/yum.repos.d/wazuh.repo</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">sudo cp -an /etc/yum.repos.d/wazuh.repo /etc/yum.repos.d/wazuh.repo.sonic-before-disable</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">sudo sed -i &quot;s/^enabled=1/enabled=0/&quot; /etc/yum.repos.d/wazuh.repo</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">sudo grep -n &quot;enabled=&quot; /etc/yum.repos.d/wazuh.repo</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="502" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="532" r="18" fill="#21c5db"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">First inspect the repository file.</text><path d="M60 575v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="591" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="621" r="18" fill="#21c5db"/><text x="54" y="628" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="625" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">If it does not exist at this path, stop and identify the actual repo file; do not create an</text><text x="96" y="655" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">unrelated one.</text><path d="M60 693v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="709" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="739" r="18" fill="#21c5db"/><text x="54" y="746" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="743" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Copy a metadata-preserving checkpoint using cp -a -n; -n avoids replacing an earlier</text><text x="96" y="773" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">backup. sed -i edits the file in place and changes an exact enabled=1 line to enabled=0.</text><text x="44" y="827" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="865" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="895" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="927" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The Wazuh repository section shows enabled=0; the backup remains available for a deliberately</text><text x="52" y="956" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">approved upgrade.</text><text x="30" y="1050" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>