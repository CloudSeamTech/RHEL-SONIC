<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="781" viewBox="0 0 1200 781" role="img" aria-labelledby="title desc"><title id="title">Finish the handoff and control costs — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="781" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 12 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Finish the handoff and control costs</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">After the acceptance checks, detach the upgrade-media disk from APP02 &gt; Disks and save.</text><path d="M60 350v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="366" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="396" r="18" fill="#21c5db"/><text x="54" y="403" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="400" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Delete only that verified temporary disk if no longer needed.</text><path d="M60 439v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="455" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="485" r="18" fill="#21c5db"/><text x="54" y="492" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="489" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Keep backups until the rollback window ends, review activation/monitoring/patching</text><text x="96" y="519" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">implications with the owner, and deallocate the lab when pausing.</text><rect x="28" y="573" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="603" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="635" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Your evidence contains 2019 before, 2022 after, matching workload checks, recovery references,</text><text x="52" y="664" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">and cleanup decisions.</text><text x="30" y="758" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>