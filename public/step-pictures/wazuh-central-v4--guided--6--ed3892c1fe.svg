<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="989" viewBox="0 0 1200 989" role="img" aria-labelledby="title desc"><title id="title">Protect credentials and verify installed versions — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="989" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Protect credentials and verify installed versions</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL manager · Bash · rexuser</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo chmod 600 ./wazuh-install-files.tar</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">sudo ls -l ./wazuh-install-files.tar</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">rpm -q wazuh-manager wazuh-indexer wazuh-dashboard filebeat</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="475" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="505" r="18" fill="#21c5db"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">chmod 600 limits the archive to its owner. rpm -q reports installed package versions; the</text><text x="96" y="539" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">three central Wazuh components must match the approved release.</text><path d="M60 577v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="593" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="623" r="18" fill="#21c5db"/><text x="54" y="630" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="627" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Filebeat uses its own version scheme.</text><path d="M60 666v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="682" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="712" r="18" fill="#21c5db"/><text x="54" y="719" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="716" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Save the generated admin credential in your approved password manager.</text><text x="44" y="771" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="809" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="839" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="871" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Versions match the record and the archive is not readable by other users.</text><text x="30" y="966" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>