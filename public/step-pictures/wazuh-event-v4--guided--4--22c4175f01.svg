<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="962" viewBox="0 0 1200 962" role="img" aria-labelledby="title desc"><title id="title">Add one monitored directory in the editor — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="962" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Add one monitored directory in the editor</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">RHEL endpoint · Bash · rexuser</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo env SUDO_EDITOR=vi sudoedit /var/ossec/etc/ossec.conf</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">sudo grep -n &quot;sonic-fim&quot; /var/ossec/etc/ossec.conf</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="448" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="478" r="18" fill="#21c5db"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use vi explicitly so the keystrokes match: press Esc, type / followed by the search text,</text><text x="96" y="512" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">then Enter.</text><path d="M60 550v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="566" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="596" r="18" fill="#21c5db"/><text x="54" y="603" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="600" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Press n for the next match.</text><path d="M60 639v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="655" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="685" r="18" fill="#21c5db"/><text x="54" y="692" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="689" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Move with arrow keys.</text><text x="44" y="744" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="782" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="812" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="844" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Exactly one lab-directory entry appears inside the existing enabled syscheck configuration.</text><text x="30" y="939" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>