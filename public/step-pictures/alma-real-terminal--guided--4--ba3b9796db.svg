<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="957" viewBox="0 0 1200 957" role="img" aria-labelledby="title desc"><title id="title">Connect and prove a real Windows result — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="957" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 4 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Connect and prove a real Windows result</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AlmaLinux 9 GNOME desktop → Activities → Terminal, unless the step names Windows or</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">VMware Workstation Pro.</text><rect x="28" y="277" width="1144" height="139" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Get-Date</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">$env:COMPUTERNAME</text><text x="44" y="440" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="472" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="502" r="18" fill="#21c5db"/><text x="54" y="509" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="506" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">At http://localhost:3000/migration#view=terminal select Windows PowerShell.</text><path d="M60 545v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="561" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="591" r="18" fill="#21c5db"/><text x="54" y="598" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="595" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Paste the token into the local-only field and Connect locally.</text><path d="M60 634v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="650" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="680" r="18" fill="#21c5db"/><text x="54" y="687" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="684" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Run Get-Date twice.</text><text x="44" y="739" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="777" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="807" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="839" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Live date/time output appears from your current Windows account.</text><text x="30" y="934" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>