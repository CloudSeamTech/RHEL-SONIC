sans-serif" font-size="20" fill="#eaeaea">to log in.</text><rect x="28" y="460" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="490" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="522" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">TcpTestSucceeded : True. Ping can fail while TCP succeeds because ICMP and TCP are separate</text><text x="52" y="551" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">traffic types.</text><text x="30" y="645" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>