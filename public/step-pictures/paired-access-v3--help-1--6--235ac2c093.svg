<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1098" viewBox="0 0 1200 1098" role="img" aria-labelledby="title desc"><title id="title">Remove only a confirmed unwanted explicit entry — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1098" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Remove only a confirmed unwanted explicit entry</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Your own Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="247" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">$SonicRemoveSid = Read-Host &quot;Exact SID of ONE confirmed unwanted entry&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">if ($SonicRemoveSid -eq $SonicUserSid -or $SonicRemoveSid -notmatch &quot;^S-1-[0-9-]+$&quot;) {</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">throw &quot;Invalid or current-user SID: stop&quot; }</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">icacls &quot;$SonicKey&quot; /remove &quot;*$SonicRemoveSid&quot;</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#eaeaea">if ($LASTEXITCODE -ne 0) { throw &quot;Removal failed: stop&quot; }</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#eaeaea">icacls &quot;$SonicKey&quot;</text><text x="44" y="524" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="556" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="586" r="18" fill="#21c5db"/><text x="54" y="593" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="590" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">If the permission list still shows an unwanted account or group, copy its exact SID from</text><text x="96" y="620" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the error or identify it with the Windows administrator.</text><path d="M60 658v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="674" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="704" r="18" fill="#21c5db"/><text x="54" y="711" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="708" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Do not enter your own SID.</text><path d="M60 747v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="763" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="793" r="18" fill="#21c5db"/><text x="54" y="800" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="797" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Do not remove entries from a whole folder tree.</text><text x="44" y="852" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="890" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="920" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="952" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Only the intended personal-key access remains. No shared group or unrelated user can read the</text><text x="52" y="981" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">key.</text><text x="30" y="1075" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>