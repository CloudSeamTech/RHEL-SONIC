<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="844" viewBox="0 0 1200 844" role="img" aria-labelledby="title desc"><title id="title">Review Networking: BOTH SQL VMs must be able to reach the Blob service on ou — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="844" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 5 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Review Networking: BOTH SQL VMs must be able to reach the Blob</text><text x="30" y="122" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">service on ou</text><rect x="28" y="163" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 187h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="193" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="223" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal / Storage account for cloud witness / approved subscription account;</text><text x="114" y="251" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">optional extension.</text><rect x="28" y="311" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="341" r="18" fill="#21c5db"/><text x="54" y="348" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="345" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Review Networking: BOTH SQL VMs must be able to reach the Blob service on outbound HTTPS</text><text x="96" y="375" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">TCP 443.</text><path d="M60 413v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="429" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="459" r="18" fill="#21c5db"/><text x="54" y="466" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="463" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Follow your environment’s approved public/private storage connectivity design; never expose</text><text x="96" y="493" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the SQL servers publicly.</text><path d="M60 531v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="547" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="577" r="18" fill="#21c5db"/><text x="54" y="584" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="581" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Check network rules before disabling public access.</text><rect x="28" y="636" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="666" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="698" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="727" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="821" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>