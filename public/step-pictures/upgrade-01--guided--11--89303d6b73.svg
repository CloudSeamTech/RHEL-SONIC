<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="967" viewBox="0 0 1200 967" role="img" aria-labelledby="title desc"><title id="title">Verify Server 2022 and the migrated workload — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="967" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 11 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Verify Server 2022 and the migrated workload</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="247" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Get-ComputerInfo | Select-Object WindowsProductName, OsBuildNumber</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">Get-Service W3SVC</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">Test-ComputerSecureChannel -Verbose</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">Invoke-WebRequest http://localhost/index.html -UseBasicParsing | Select-Object</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">StatusCode</text><text x="54" y="492" font-family="monospace" font-size="18" fill="#eaeaea">Get-FileHash C:\inetpub\wwwroot\index.html -Algorithm SHA256</text><text x="44" y="548" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="580" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="610" r="18" fill="#21c5db"/><text x="54" y="617" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="614" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">After reconnecting to APP02 run the same checks as the 2019 baseline.</text><path d="M60 653v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="669" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="699" r="18" fill="#21c5db"/><text x="54" y="706" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="703" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Test the site from the same approved private client, compare its content hash, and verify</text><text x="96" y="733" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">the domain secure channel and application authentication.</text><rect x="28" y="787" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="817" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="849" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">WindowsProductName says Windows Server 2022; the IIS site and private client test still pass.</text><text x="30" y="944" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>