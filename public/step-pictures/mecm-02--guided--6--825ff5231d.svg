<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="721" viewBox="0 0 1200 721" role="img" aria-labelledby="title desc"><title id="title">SSMS on SQL01 / Security — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="721" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">SSMS on SQL01 / Security</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">DC01, SQL01, and MECM01 / ADUC, SSMS, and Windows security tools / authorized</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">administrators.</text><rect x="28" y="277" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">SSMS on SQL01 &gt; Security &gt; Logins &gt; New Login &gt; CLOUDSEAM\MECM01$ &gt; Server Roles &gt;</text><text x="96" y="341" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">sysadmin.</text><path d="M60 379v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="395" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="425" r="18" fill="#21c5db"/><text x="54" y="432" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="429" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">This high privilege is required by Configuration Manager; apply only to the isolated lab</text><text x="96" y="459" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">SQL instance.</text><rect x="28" y="513" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="543" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="575" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="604" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="698" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>