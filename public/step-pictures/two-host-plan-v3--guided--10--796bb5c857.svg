<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="697" viewBox="0 0 1200 697" role="img" aria-labelledby="title desc"><title id="title">Check the result and save your notes — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="697" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 10 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Check the result and save your notes</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Windows · PowerShell</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Confirm the central host has adequate CPU/RAM/storage, RHEL 9 is supported by the selected</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">stable release, and the plan does not depend on a third Linux VM.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="371" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#21c5db"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">A successful future change requires dashboard check-in and useful logs, not just two</text><text x="96" y="435" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Running Azure statuses.</text><rect x="28" y="489" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="519" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="551" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Two distinct host roles, a reviewed combined budget, and one continuous change record. Neither</text><text x="52" y="580" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Wazuh component is installed yet.</text><text x="30" y="674" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>