<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="726" viewBox="0 0 1200 726" role="img" aria-labelledby="title desc"><title id="title">Re-run a read/write query against your test database by connecting via AG li — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="726" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Re-run a read/write query against your test database by connecting</text><text x="30" y="122" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">via AG li</text><rect x="28" y="163" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 187h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="193" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="223" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Approved SQL lab cluster / Failover Cluster Manager and application checks /</text><text x="114" y="251" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">authorized cluster administrator.</text><rect x="28" y="311" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="341" r="18" fill="#21c5db"/><text x="54" y="348" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="345" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Re-run a read/write query against your test database by connecting via AG listener, NOT by</text><text x="96" y="375" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">hard-coding the SQL01 node name.</text><path d="M60 413v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="429" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="459" r="18" fill="#21c5db"/><text x="54" y="466" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="463" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Verify the primary changed and data stayed consistent.</text><rect x="28" y="518" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="548" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="580" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="609" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="703" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>