<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="987" viewBox="0 0 1200 987" role="img" aria-labelledby="title desc"><title id="title">Apply the reviewed permanent rules and check again — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="987" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Apply the reviewed permanent rules and check again</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Wazuh manager · connected RHEL Bash session · rexuser</text><rect x="28" y="253" width="1144" height="193" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --check-config</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea"># Continue only if configuration validation succeeds.</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --reload</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --zone=&quot;$SONIC_ZONE&quot; --query-rich-rule=&quot;$SONIC_HTTPS_RULE&quot;</text><text x="44" y="470" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="502" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="532" r="18" fill="#21c5db"/><text x="54" y="539" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="536" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Proceed only on the successful save branch and in the approved change window.</text><path d="M60 575v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="591" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="621" r="18" fill="#21c5db"/><text x="54" y="628" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="625" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Check the permanent configuration, then reload.</text><path d="M60 664v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="680" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="710" r="18" fill="#21c5db"/><text x="54" y="717" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="714" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Keep the console/recovery path ready.</text><text x="44" y="769" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="807" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="837" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="869" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The permanent rule is active after reload and the client tests still pass.</text><text x="30" y="964" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>