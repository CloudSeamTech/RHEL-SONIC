<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="824" viewBox="0 0 1200 824" role="img" aria-labelledby="title desc"><title id="title">Before anything changes: decide exactly what to back up — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="824" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Before anything changes: decide exactly what to back up</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Work administration workstation · change record and Veeam console (12 or 13)</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Start with the VM you will change: select its whole-VM backup, including the OS disk and</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">every data disk used by the application.</text><path d="M60 355v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="371" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="401" r="18" fill="#21c5db"/><text x="54" y="408" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="405" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">For a new RHEL installation, back up the clean, working VM before installing Wazuh.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="460" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="490" r="18" fill="#21c5db"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">After successful installation and verification, create a new accepted baseline; retain the</text><text x="96" y="524" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">pre-change recovery point according to policy.</text><text x="44" y="578" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="616" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="646" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">A named list of affected VMs, all required disks, dependencies and application-consistency</text><text x="52" y="707" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">requirements exists before a backup job is selected.</text><text x="30" y="801" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>