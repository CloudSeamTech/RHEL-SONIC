<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="757" viewBox="0 0 1200 757" role="img" aria-labelledby="title desc"><title id="title">Website step 5 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="757" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 8 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Website step 5</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Your Windows computer · browser → https://portal.azure.com</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Keep unrelated or production resources out of this disposable lab group.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="342" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#21c5db"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use separate groups when resources have different owners, access policies or retirement</text><text x="96" y="406" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">dates—for example, a shared network or recovery copies that must outlive the lab.</text><path d="M60 444v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="460" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="490" r="18" fill="#21c5db"/><text x="54" y="497" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="494" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Record any deliberate exception and its resource ID.</text><rect x="28" y="549" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="579" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="611" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Check the named resource and settings before the next step. If the page shows an error, stop</text><text x="52" y="640" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">and read it before continuing.</text><text x="30" y="734" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>