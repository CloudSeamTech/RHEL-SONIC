<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="693" viewBox="0 0 1200 693" role="img" aria-labelledby="title desc"><title id="title">Scope the Windows firewall rule — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="693" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 11 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Scope the Windows firewall rule</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">SQL01 / SQL Server 2022 Setup and Configuration Manager / authorized setup</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">administrator.</text><rect x="28" y="277" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">On SQL01 open Windows Defender Firewall with Advanced Security &gt; Inbound Rules &gt; New Rule &gt;</text><text x="96" y="341" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Port &gt; TCP &gt; Specific local ports 1433 &gt; Allow the connection.</text><path d="M60 379v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="395" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="425" r="18" fill="#21c5db"/><text x="54" y="432" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="429" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use the Domain profile, name the rule, then Properties &gt; Scope and limit remote addresses</text><text x="96" y="459" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">to the recorded MECM01/authorized private admin IPs.</text><rect x="28" y="513" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="543" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="575" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The SQL rule is private, scoped, and documented.</text><text x="30" y="670" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>