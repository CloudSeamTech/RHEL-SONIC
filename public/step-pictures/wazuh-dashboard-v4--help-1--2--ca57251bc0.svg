<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1042" viewBox="0 0 1200 1042" role="img" aria-labelledby="title desc"><title id="title">Inspect the RHEL firewall before adding a rule — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1042" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Inspect the RHEL firewall before adding a rule</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Wazuh manager · connected RHEL Bash session · rexuser</text><rect x="28" y="253" width="1144" height="220" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">hostname</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --state</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --get-active-zones</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --list-all-zones</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#eaeaea">sudo firewall-cmd --permanent --list-all-zones</text><text x="44" y="497" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="529" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="559" r="18" fill="#21c5db"/><text x="54" y="566" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Keep your working administration connection open.</text><path d="M60 602v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="618" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="648" r="18" fill="#21c5db"/><text x="54" y="655" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="652" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Run the checks below.</text><path d="M60 691v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="707" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="737" r="18" fill="#21c5db"/><text x="54" y="744" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="741" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Confirm firewalld is running and identify the active zone for dashboard traffic.</text><text x="44" y="796" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="834" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="864" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="896" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">You know the correct zone and existing rules. If the firewall is not running, review the actual</text><text x="52" y="925" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">firewall system before proceeding.</text><text x="30" y="1019" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>