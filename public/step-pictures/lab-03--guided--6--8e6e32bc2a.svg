<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="794" viewBox="0 0 1200 794" role="img" aria-labelledby="title desc"><title id="title">Connect the guests to VMnet2 — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="794" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Connect the guests to VMnet2</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Windows 10 host / VMware Workstation Pro / Virtual Network Editor.</text><rect x="28" y="253" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">When each guest VM exists and is powered off, select it &gt; VM &gt; Settings &gt; Network Adapter.</text><path d="M60 326v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="342" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="372" r="18" fill="#21c5db"/><text x="54" y="379" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="376" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Choose Custom: Specific virtual network &gt; VMnet2 and enable Connect at power on.</text><path d="M60 415v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="431" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="461" r="18" fill="#21c5db"/><text x="54" y="468" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="465" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Keep one network adapter.</text><text x="44" y="520" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="558" width="1144" height="144" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="588" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="620" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">Both guest adapters use the same VMnet2. After their static-address lessons, their live</text><text x="52" y="649" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">consoles show DC01 10.50.0.10/24 and DC02 10.50.0.11/24. The DC02 Windows lesson proves replies</text><text x="52" y="678" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">in both directions before promotion.</text><text x="30" y="771" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>