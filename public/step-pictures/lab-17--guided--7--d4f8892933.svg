<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="988" viewBox="0 0 1200 988" role="img" aria-labelledby="title desc"><title id="title">Transfer the test site over the private path — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="988" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Transfer the test site over the private path</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">APP01 Server 2019 Workstation guest, Azure portal, then APP02 Server 2019 Azure</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">member VM / authorized source, transfer, and destination administrators.</text><rect x="28" y="277" width="1144" height="112" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Get-FileHash C:\inetpub\wwwroot\index.html -Algorithm SHA256</text><text x="44" y="413" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="445" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="475" r="18" fill="#21c5db"/><text x="54" y="482" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="479" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">On APP01 create a temporary read-only SMB share for the test site, limited to the</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">authorized transfer identity and private APP02 path.</text><path d="M60 547v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="563" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="593" r="18" fill="#21c5db"/><text x="54" y="600" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="597" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">From APP02 open the UNC path using an explicitly authorized source account and copy</text><text x="96" y="627" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">index.html into C:\inetpub\wwwroot.</text><path d="M60 665v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="681" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="711" r="18" fill="#21c5db"/><text x="54" y="718" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="715" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Remove the temporary share and credential mapping afterward.</text><text x="44" y="770" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="808" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="838" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="870" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The site file exists on APP02 and matches the source SHA-256 hash.</text><text x="30" y="965" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>