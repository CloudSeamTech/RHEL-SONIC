<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="940" viewBox="0 0 1200 940" role="img" aria-labelledby="title desc"><title id="title">Create, copy and rename — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="940" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Create, copy and rename</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">AlmaLinux 9 GNOME desktop → Activities → Terminal, unless the step names Windows or</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">VMware Workstation Pro.</text><rect x="28" y="277" width="1144" height="220" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">cd ~/DesktopPractice</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">printf &quot;first line\nsecond line\n&quot; &gt; notes.txt</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">cp -i notes.txt copy.txt</text><text x="54" y="436" font-family="monospace" font-size="18" fill="#eaeaea">mv -i copy.txt renamed.txt</text><text x="54" y="464" font-family="monospace" font-size="18" fill="#eaeaea">cat renamed.txt</text><text x="44" y="521" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="553" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="583" r="18" fill="#21c5db"/><text x="54" y="590" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="587" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Write two lines to a practice text file. &gt; replaces that named file; do not aim it at</text><text x="96" y="617" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">valuable files.</text><path d="M60 655v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="671" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="701" r="18" fill="#21c5db"/><text x="54" y="708" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="705" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Copy first, then rename the copy.</text><rect x="28" y="760" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="790" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="822" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">You have notes.txt and renamed.txt with the same two lines.</text><text x="30" y="917" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>