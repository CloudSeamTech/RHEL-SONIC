<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="924" viewBox="0 0 1200 924" role="img" aria-labelledby="title desc"><title id="title">Get ready in Windows PowerShell — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="924" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Get ready in Windows PowerShell</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Your Windows computer · Windows Terminal → PowerShell · normal user</text><rect x="28" y="253" width="1144" height="139" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">Set-Location -LiteralPath $env:USERPROFILE</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">Test-Path -LiteralPath ./rexuser-transfer-v3.txt</text><text x="44" y="416" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="448" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="478" r="18" fill="#21c5db"/><text x="54" y="485" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="482" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use your existing local PowerShell tab. $KeyPath must point to your private key and</text><text x="96" y="512" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">$EndpointPublicIp must match the endpoint public address in Azure.</text><path d="M60 550v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="566" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="596" r="18" fill="#21c5db"/><text x="54" y="603" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="600" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Run Set-Location to select your Windows user folder.</text><path d="M60 639v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="655" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="685" r="18" fill="#21c5db"/><text x="54" y="692" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="689" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">The practice file rexuser-transfer-v3.txt must be there from the earlier lesson.</text><rect x="28" y="744" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="774" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="806" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">PowerShell is in your user folder and the practice file exists.</text><text x="30" y="901" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>