<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1122" viewBox="0 0 1200 1122" role="img" aria-labelledby="title desc"><title id="title">Download and validate on Windows before transfer — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="1122" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 3 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Download and validate on Windows before transfer</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Windows workstation · PowerShell</text><rect x="28" y="253" width="1144" height="328" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">$SonicStage = Join-Path $env:USERPROFILE &quot;sonic-artifacts&quot;</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">New-Item -ItemType Directory -Force -Path $SonicStage | Out-Null</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">$SonicRpm = Join-Path $SonicStage &quot;wazuh-agent.rpm&quot;</text><text x="54" y="412" font-family="monospace" font-size="18" fill="#eaeaea">$SonicUrl = Read-Host &quot;Exact official HTTPS RPM URL&quot;</text><text x="54" y="440" font-family="monospace" font-size="18" fill="#eaeaea">$SonicExpected = (Read-Host &quot;Vendor SHA-512 digest only&quot;).Trim()</text><text x="54" y="468" font-family="monospace" font-size="18" fill="#eaeaea">if ($SonicUrl -notmatch &quot;^https://packages\.wazuh\.com/&quot;) { throw &quot;Use the official</text><text x="54" y="496" font-family="monospace" font-size="18" fill="#eaeaea">package URL&quot; }</text><text x="54" y="524" font-family="monospace" font-size="18" fill="#eaeaea">if ($SonicExpected -notmatch &quot;^[0-9a-fA-F]{128}$&quot;) { throw &quot;Invalid SHA-512 value&quot; }</text><text x="54" y="552" font-family="monospace" font-size="18" fill="#eaeaea">Invoke-WebRequest -Uri $SonicUrl -OutFile $SonicRpm</text><text x="44" y="605" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="637" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="667" r="18" fill="#21c5db"/><text x="54" y="674" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="671" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Open Windows Terminal → PowerShell.</text><path d="M60 710v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="726" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="756" r="18" fill="#21c5db"/><text x="54" y="763" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="760" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Create a staging folder under your local profile.</text><path d="M60 799v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="815" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="845" r="18" fill="#21c5db"/><text x="54" y="852" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="849" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Paste the exact official RPM URL and the separate vendor SHA-512 value at the prompts.</text><text x="44" y="904" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="942" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="972" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="1004" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">VENDOR SHA-512 MATCH appears before you transfer anything.</text><text x="30" y="1099" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>