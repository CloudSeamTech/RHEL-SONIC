<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="753" viewBox="0 0 1200 753" role="img" aria-labelledby="title desc"><title id="title">Choose Desktop Experience — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="753" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 12 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Choose Desktop Experience</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Physical host Workstation Pro, then AG-DC02 Server 2019 guest / local Administrator</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">and agency.test Domain Admin.</text><rect x="28" y="277" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Select Windows Server 2019 Standard (Desktop Experience), or the matching authorized</text><text x="96" y="341" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Datacenter (Desktop Experience) edition your course supplies.</text><path d="M60 379v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="395" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="425" r="18" fill="#21c5db"/><text x="54" y="432" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="429" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">If using Evaluation for local practice, record that limitation.</text><path d="M60 468v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="484" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="514" r="18" fill="#21c5db"/><text x="54" y="521" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="518" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Click Next and accept the license only if you agree.</text><rect x="28" y="573" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="603" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="635" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The selected line explicitly includes 2019 and Desktop Experience.</text><text x="30" y="730" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>