<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="579" viewBox="0 0 1200 579" role="img" aria-labelledby="title desc"><title id="title">Draw arrows: APP01 - / MECM management service; MECM01 - — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="579" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 2 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Draw arrows: APP01 - / MECM management service; MECM01 -</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Lab inventory worksheet / read-only discovery and dependency planning.</text><rect x="28" y="253" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="283" r="18" fill="#21c5db"/><text x="54" y="290" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="287" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Draw arrows: APP01 -&gt; MECM management service; MECM01 -&gt; SQL01; MECM SUP -&gt; WSUS01; every</text><text x="96" y="317" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">domain-joined server -&gt; AD DNS/DC.</text><rect x="28" y="371" width="1144" height="116" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="401" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="433" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The named action finishes without an error; the next screen or check described in the action is</text><text x="52" y="462" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">available.</text><text x="30" y="556" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>