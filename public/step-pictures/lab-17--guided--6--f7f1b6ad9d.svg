<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="886" viewBox="0 0 1200 886" role="img" aria-labelledby="title desc"><title id="title">Join the destination domain and install IIS — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="886" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 6 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Join the destination domain and install IIS</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">APP01 Server 2019 Workstation guest, Azure portal, then APP02 Server 2019 Azure</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">member VM / authorized source, transfer, and destination administrators.</text><rect x="28" y="277" width="1144" height="166" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="277" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="304" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="352" font-family="monospace" font-size="18" fill="#eaeaea">Install-WindowsFeature Web-Server -IncludeManagementTools</text><text x="54" y="380" font-family="monospace" font-size="18" fill="#eaeaea">Test-ComputerSecureChannel -Verbose</text><text x="54" y="408" font-family="monospace" font-size="18" fill="#eaeaea">Get-Service W3SVC</text><text x="44" y="467" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="499" width="1144" height="96" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="529" r="18" fill="#21c5db"/><text x="54" y="536" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="533" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">With private DNS to AZ-DC01 verified, use sysdm.cpl &gt; Computer Name &gt; Change to join</text><text x="96" y="563" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">ad.cloudscene.tech with authorized credentials.</text><path d="M60 601v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="617" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="647" r="18" fill="#21c5db"/><text x="54" y="654" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="651" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Restart, then install IIS from elevated PowerShell.</text><rect x="28" y="706" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="736" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="768" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">APP02 is a member server, has a healthy domain secure channel, and IIS is running.</text><text x="30" y="863" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>