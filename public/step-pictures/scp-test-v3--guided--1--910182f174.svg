<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="960" viewBox="0 0 1200 960" role="img" aria-labelledby="title desc"><title id="title">Check the destination before copying — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="960" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 1 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Check the destination before copying</text><rect x="28" y="129" width="1144" height="99" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Endpoint rhel9-lab-01 · connected SSH tab · RHEL Bash as rexuser</text><rect x="28" y="253" width="1144" height="166" rx="10" fill="#030303" stroke="#404040"/><rect x="28" y="253" width="1144" height="40" rx="10" fill="#202020"/><text x="52" y="280" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">TERMINAL · COMMAND EXAMPLE · NOT OUTPUT</text><text x="54" y="328" font-family="monospace" font-size="18" fill="#eaeaea">hostname</text><text x="54" y="356" font-family="monospace" font-size="18" fill="#eaeaea">if test -e /home/rexuser/rexuser-transfer-v3.txt; then echo EXISTS; else echo AVAILABLE;</text><text x="54" y="384" font-family="monospace" font-size="18" fill="#eaeaea">fi</text><text x="44" y="443" font-family="Arial, sans-serif" font-size="19" fill="#898989">Read and copy the complete command block in the written step below.</text><rect x="28" y="475" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="505" r="18" fill="#21c5db"/><text x="54" y="512" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="509" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Use your existing SSH connection to the endpoint.</text><path d="M60 548v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="564" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="594" r="18" fill="#21c5db"/><text x="54" y="601" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="598" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Run hostname and confirm the right computer.</text><path d="M60 637v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="653" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="683" r="18" fill="#21c5db"/><text x="54" y="690" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="687" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">The test below prints EXISTS or AVAILABLE.</text><text x="44" y="742" font-family="Arial, sans-serif" font-size="18" fill="#898989">Continue with the remaining small actions in the written step.</text><rect x="28" y="780" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="810" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="842" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">You are on the endpoint and the intended filename is available.</text><text x="30" y="937" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>