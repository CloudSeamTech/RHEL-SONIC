<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="782" viewBox="0 0 1200 782" role="img" aria-labelledby="title desc"><title id="title">Attach the upgrade media as a DATA disk — illustrated step map</title><desc id="desc">Step-specific diagram showing where to work, numbered actions, and what to check. It is not a software screenshot or actual output.</desc><rect width="1200" height="782" fill="#080808"/><rect width="1200" height="7" fill="#21c5db"/><text x="30" y="43" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">STEP 7 · PICTURE GUIDE</text><text x="30" y="86" font-family="Arial, sans-serif" font-size="26" fill="#eaeaea">Attach the upgrade media as a DATA disk</text><rect x="28" y="129" width="1144" height="123" rx="10" fill="#11181b" stroke="#21c5db"/><path d="M54 153h42v29H54zm21 29v12m-15 0h30" fill="none" stroke="#21c5db" stroke-width="3"/><text x="114" y="159" font-family="Arial, sans-serif" font-size="17" fill="#21c5db">START HERE</text><text x="114" y="189" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">Azure portal plus APP02 guest; Az PowerShell on the admin workstation for media</text><text x="114" y="217" font-family="Arial, sans-serif" font-size="18" fill="#eaeaea">creation; elevated Windows PowerShell INSIDE APP02 for Setup.</text><rect x="28" y="277" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="307" r="18" fill="#21c5db"/><text x="54" y="314" font-family="Arial, sans-serif" font-size="20" fill="#000">1</text><text x="96" y="311" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">In Azure open APP02 &gt; Disks.</text><path d="M60 350v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="366" width="1144" height="125" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="396" r="18" fill="#21c5db"/><text x="54" y="403" font-family="Arial, sans-serif" font-size="20" fill="#000">2</text><text x="96" y="400" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Choose Attach existing disks (the label can appear as Attach existing data disk), select</text><text x="96" y="430" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">SONIC-Server2022-Upgrade as a data disk, set host caching to None where offered, and</text><text x="96" y="460" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Save/Apply.</text><path d="M60 497v15m-6-6 6 6 6-6" fill="none" stroke="#898989" stroke-width="2"/><rect x="28" y="513" width="1144" height="67" rx="10" fill="#101010" stroke="#343434"/><circle cx="60" cy="543" r="18" fill="#21c5db"/><text x="54" y="550" font-family="Arial, sans-serif" font-size="20" fill="#000">3</text><text x="96" y="547" font-family="Arial, sans-serif" font-size="20" fill="#eaeaea">Start APP02 if it is stopped.</text><rect x="28" y="602" width="1144" height="88" rx="10" fill="#101010" stroke="#35d778"/><text x="52" y="632" font-family="Arial, sans-serif" font-size="17" fill="#35d778">LOOK FOR THIS IN YOUR OWN LAB</text><text x="52" y="664" font-family="Arial, sans-serif" font-size="19" fill="#eaeaea">The media disk appears in APP02’s data-disk list; its OS disk is unchanged.</text><text x="30" y="759" font-family="Arial, sans-serif" font-size="17" fill="#dfb656">ILLUSTRATED STEP MAP · NOT A LIVE SCREENSHOT OR RESULT</text></svg>